# Blueprint Render — API HisabPro en mode TEST (offre gratuite).
# Render → New → Blueprint → choisir ce repo.
services:
  - type: web
    name: hisabpro-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r hisabpro-backend/requirements.txt
    # Au premier démarrage, initialise la base vierge (tables + migrations) ;
    # ensuite le script constate que la base existe et ne fait rien.
    startCommand: python ops/init_base_test.py && cd hisabpro-backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/docs
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false          # à coller : chaîne de connexion Neon
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: HISABPRO_CREATE_TABLES
        value: "0"
      - key: ALGORITHM
        value: HS256
      - key: CORS_ORIGINS
        value: https://yauxer.github.io
